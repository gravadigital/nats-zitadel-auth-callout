# nats-server.conf — NATS de gestión, modo operator + JetStream.
#
# El modo operator es un requisito del auth callout: la autorización se decide con JWTs
# firmados por cuentas, y es lo que le permite al callout emitir un User JWT distinto por
# conexión. Un server en modo "authorization {}" clásico no puede hacerlo.
#
# La configuración de auth callout NO está acá: vive en el JWT de la cuenta AUTH, puesta
# por `nsc edit authcallout` (ver bootstrap.sh) y precargada en nats-resolver.conf.

# Puertos deliberadamente NO estándar (4222/8222), para poder correr este NATS al lado de
# otro que ya esté escuchando en los puertos de siempre.
port: 4322
http: 8322

server_name: gestion-nats

# El operator, la system account y todos los JWTs de cuenta, precargados por el bootstrap.
include ./out/nats-resolver.conf

# JetStream: los buckets de KV son streams. Sin esto, los permisos de KV que mintea el
# callout apuntan a subjects que nadie atiende.
jetstream {
  store_dir: "./data/jetstream"
}

# El auth callout agrega un round-trip (validar el token contra Zitadel) al handshake de
# cada conexión, así que el timeout de autenticación tiene que tolerarlo. El default de 2s
# alcanza para un JWKS cacheado, pero no para el primer fetch ni para un userinfo lento.
authorization {
  timeout: 5
}

# Logging. debug/trace quedan apagados: trace loguearía los CONNECT, que llevan el access
# token del cliente.
debug: false
trace: false
logtime: true

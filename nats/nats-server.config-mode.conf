# nats-server.config-mode.conf — auth callout on a CONFIG-MODE NATS.
#
# This is the file to copy if you already run a NATS whose authorization lives in
# nats-server.conf (users and permissions written in the file) rather than in operator-signed
# account JWTs. It is the common case for a NATS an infra team brought up without needing
# multi-tenancy, and adopting the callout does NOT require migrating to operator mode.
#
# What you have to generate once (nothing here is secret except the seeds):
#
#   nats auth nkey gen account --output callout-issuer.nk   # A... pubkey + seed
#   nats auth nkey gen curve   --output callout-xkey.nk     # X... pubkey + SX... seed
#
# and then give the callout process:
#
#   CALLOUT_SERVER_MODE=config
#   CALLOUT_APP_ACCOUNT_SK_SEED=<the issuer SEED>     # signs the User JWT
#   CALLOUT_TARGET_ACCOUNT=APP                        # the account NAME below
#   CALLOUT_XKEY_SEED=<the xkey SEED>
#   CALLOUT_HANDLER_USER=callout-handler
#   CALLOUT_HANDLER_PASSWORD=<the password below>
#
# THE THREE MISTAKES THAT COST THE MOST HERE
#
#  1. Putting a CLIENT user in auth_users. Anything listed there BYPASSES the callout entirely
#     and keeps that user's own permissions. It is an open, silent failure: the client connects
#     fine and is simply never authenticated against the IdP. Only the callout's own user
#     belongs in auth_users.
#
#  2. Leaving the callout in the global account ($G), which is the DEFAULT when `account` is
#     omitted. Every other $G connection could then subscribe to $SYS.REQ.USER.AUTH and observe
#     the credential traffic. Always give the callout its own account, as below.
#
#  3. Forgetting `jetstream: enabled` on the target account. Once an accounts{} block exists,
#     JetStream is opt-in PER ACCOUNT — and a missing one does not produce a permissions error:
#     the client's KV call goes unanswered and reports a TIMEOUT, which says nothing about the
#     cause. If the templates use `kv:`, this line is mandatory.

port: 4222
http: 8222

server_name: nats-with-auth-callout

# JetStream has to be on at the server level too; the per-account line below is what grants it
# to the account clients land in.
#
# store_dir is relative to the server's WORKING DIRECTORY, not to this file. Point it at an
# absolute path in a real deployment, so the data does not land wherever the process happened to
# be started from.
jetstream {
  store_dir: "./data/jetstream"
}

accounts {
  # The callout's own account. It exists so the auth traffic is not visible to application
  # connections. Nothing but the callout lives here.
  AUTH: {
    users: [
      # The callout itself. This is the ONLY user that may appear in auth_users.
      { user: callout-handler, password: "CHANGE-ME-handler" }

      # The user clients connect with. It is deliberately NOT in auth_users, so connecting with
      # it TRIGGERS the callout, and it is denied everything of its own: every permission a
      # connection ends up with comes from the User JWT the callout mints.
      #
      # It is safe to distribute: on its own it authorizes nothing.
      {
        user: callout-client, password: "CHANGE-ME-client"
        permissions: {
          publish: { deny: ">" }
          subscribe: { deny: ">" }
        }
      }
    ]
  }

  # Where authenticated clients land. This name is what goes in CALLOUT_TARGET_ACCOUNT — the
  # NAME, not the account's public key: the server resolves the placement by name.
  APP: {
    jetstream: enabled
  }
}

authorization {
  # Auth callout adds a round trip (validating the token against the IdP) to every connection's
  # handshake, so the authentication timeout has to tolerate it. The 2s default is enough for a
  # cached JWKS but not for the first fetch.
  timeout: 5

  auth_callout {
    # The account public key (A...) whose seed the callout signs User JWTs with. The server
    # compares the User JWT's issuer against this value.
    #
    # REPLACE IT. This is a throwaway key generated for the example: the server validates the
    # nkey's checksum, so a literal placeholder would not even parse — which is why a real-looking
    # one is here. Anyone holding its seed could mint permissions on your bus.
    issuer: "ACDBTKCICA2UXXTTBR5ZJK7VIITX5B2R46C6DHSOI2C34M4GHN2IMRO6"

    # The account the callout connects in and where $SYS.REQ.USER.AUTH is served.
    account: AUTH

    # ONLY the callout's own user. See mistake 1 above.
    auth_users: [ callout-handler ]

    # The curve public key (X...) requests are encrypted toward. Without it the clients' access
    # tokens travel in the clear on $SYS.REQ.USER.AUTH — base64 is encoding, not encryption.
    #
    # REPLACE IT too, for the same reason.
    xkey: "XBFCS5BN2VE5WGRJHWC7CMBYACAIU3USO2YUKS4RUZXAW232B4IH4B6E"

    # OPTIONAL. Restricts which accounts get delegated to the callout; with it absent, every
    # account is. It is what lets an EXISTING deployment adopt the callout incrementally:
    # accounts left out of this list keep authenticating exactly as they do today.
    #
    #   allowed_accounts: [ APP ]
  }
}

# Logging. `trace` stays off on purpose: it would log the CONNECT messages, which carry the
# clients' access tokens.
debug: false
trace: false
logtime: true

name: Release

# Publishing is deliberate: a tag, pushed on purpose, is the only thing that produces an image.
# Merging to main does not, so `latest` never moves because somebody merged a pull request.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          # See ci.yml: go.mod pins no patch release, and a release should not be built with a
          # toolchain that has known fixes available.
          go-version: stable
          cache: true

      # A tag must not publish something unverified. CI already ran on main, but a tag can point
      # at any commit, so the gate runs again here against exactly what is being shipped.
      - name: make ci
        run: make ci

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tagging policy:
      #   v1.2.3  ->  1.2.3, 1.2, latest
      #
      # `1.2` lets a deployment take patch releases without taking minor ones. `latest` is
      # applied only to a real release: a prerelease tag such as v1.2.3-rc.1 publishes its own
      # tag and leaves latest alone, so an -rc never reaches someone who asked for latest.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: gravadigital/nats-zitadel-auth-callout
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the published image runs and knows which version it is. Without this a broken
      # build is discovered by whoever pulls it first.
      - name: Smoke-test the published image
        run: |
          image="gravadigital/nats-zitadel-auth-callout:${GITHUB_REF_NAME#v}"
          echo "checking $image"
          got=$(docker run --rm "$image" version | head -1)
          echo "$got"
          case "$got" in
            *"${GITHUB_REF_NAME}"*) echo "version matches the tag" ;;
            *) echo "::error::the image reports '$got', which does not carry ${GITHUB_REF_NAME}"; exit 1 ;;
          esac

      # Docker Hub shows nothing on a repository page unless something puts it there. Linking a
      # source repository is a Pro/Team/Business feature AND is tied to Automated Builds, which
      # Docker has deprecated for retirement on 2027-04-01 — so the supported path is to write
      # the overview through the API, which is what this does.
      #
      # docs/docker-hub.md rather than README.md: the README's links are relative and would break
      # here, and its first screen is written for somebody arriving at the repository rather than
      # somebody looking at an image and wanting to run it.
      #
      # It needs a token with read/write/delete scope. A push-only token authenticates but cannot
      # write the description, and the failure is not obvious — hence continue-on-error, so a
      # published release is never marked failed over its description.
      - name: Update the Docker Hub overview
        uses: peter-evans/dockerhub-description@e98e4d1628a5f3be2be7c231e50981aee98723ae # v4.0.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: gravadigital/nats-zitadel-auth-callout
          readme-filepath: ./docs/docker-hub.md
          # Shown in Docker Hub search results. Limited to 100 characters.
          short-description: "NATS auth callout: authenticate connections against OIDC and mint per-role permissions"
          enable-url-completion: true

# PoC — PERSON with the `poc-admin` role (broad permissions)
#
# Grammar and placeholders: see poc-person.yaml.
#
# Differences against `poc-user`, which are exactly what the test verifies:
#   messages  every method of `demo` (admin_reset included), not just two
#   KV        reads the WHOLE bucket; writes only its own
#
# A broad role is NOT a NATS superuser: it stays scoped to its own user id, so it cannot
# publish while impersonating someone else, nor read anyone's inbox.

pub:
  allow:
    - "{{instance}}.{{user_id}}.demo.>"

sub:
  allow:
    - "_INBOX.{{user_id_hash}}.>"

kv:
  # Two entries over the SAME bucket, with different scopes: full read and scoped write. It is
  # how you express "sees everything, touches only its own".
  - bucket: poc-kv
    access: read
    keys: ">"
    watch: true

  - bucket: poc-kv
    access: read-write
    keys: "{{user_id}}.>"

response:
  max: 1
  ttl: 45s

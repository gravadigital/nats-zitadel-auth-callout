# PoC — SERVICE USER with the `poc-service` role (the `demo` service)
#
# Grammar: <instance>.<user-id>.<svc>.<method>
#
# WHAT IT DEMONSTRATES
#   That IDENTITY and ENDPOINT are two different things. A service user is also a Zitadel
#   user: it has its own `sub`, and that is its {{user_id}} just as it would be for a person.
#   What makes it a service is additionally having an endpoint NAME ({{service}} == "demo"),
#   which is how it gets called.
#
#   The practical consequence: several replicas of the same service share the endpoint — that
#   is what allows balancing with queue groups — even though each one connects with its own
#   user id.
#
# HOW IT SERVES
#   It subscribes to `<instance>.*.demo.>`: the `*` covers ANY caller's user id. The user id
#   of whoever called arrives in the message's subject, vouched for by the callout — the
#   service reads it from there and not from the body. That is what prevents one client from
#   impersonating another: the subject is fixed by the permission, not by the application.

pub:
  allow:
    # Outbound requests under its own identity. In the PoC there is no other service to call;
    # it is declared because that is the shape of the permission in a real deployment.
    - "{{instance}}.{{user_id}}.>"

sub:
  allow:
    # Serve the requests directed at its endpoint, from any caller.
    - "{{instance}}.*.{{service}}.>"
    # Its own inbox (replies from the services it calls), under the hash of its user id just
    # like a person. It is PER REPLICA, not per endpoint: two replicas with different service
    # users do not steal each other's replies.
    - "_INBOX.{{user_id_hash}}.>"

kv:
  # Owner of the test bucket: `manage: true` is what allows it to CREATE it. Every bucket
  # needs exactly one service with manage, or there is nobody to create it and data
  # operations fail with "stream not found" without explaining why.
  #
  # `manage` is a SEPARATE axis from `access`: a bucket can be administered without being able
  # to read what is inside (access: none) or, as here, administered and operated as well.
  - bucket: poc-kv
    access: read-write
    manage: true
    keys: ">"
    watch: true

response:
  # Answer the requests it serves.
  max: 1
  ttl: 45s

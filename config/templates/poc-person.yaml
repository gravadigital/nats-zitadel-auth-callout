# PoC — PERSON with the `poc-user` role (scoped permissions)
#
# GRAMMAR
#   <instance>.<user-id>.<svc>.<method>
#     instance   deployment (dev/stage/prod)
#     user-id    WHO is calling: the Zitadel `sub`, raw. The same for people and services.
#     svc        WHO it is talking to (in the PoC only `demo`)
#     method     WHAT it is asking for
#
# PLACEHOLDERS
#   {{instance}}      the deployment instance
#   {{user_id}}       the token's `sub`, raw (note: UNDERSCORE, not `{{user-id}}`)
#   {{user_id_hash}}  a stable hash of the user id — only for the inbox prefix
#   {{service}}       the endpoint name; only in service templates
#
# WHAT THIS TEMPLATE DEMONSTRATES
#   Against poc-person-admin.yaml, the SAME service and the SAME buckets, with different
#   permissions depending on the role:
#     - messages: only two methods (not `admin_reset`)
#     - KV:       only their own key (not other people's)
#   And against both, poc-service.yaml shows the other identity type.

pub:
  allow:
    # Explicit allow-list: `admin_reset` is NOT here, so it is out of reach. With a
    # deny-list, a new method would be accessible until somebody restricted it; this way,
    # nobody reaches it until it is enabled.
    - "{{instance}}.{{user_id}}.demo.ping"
    - "{{instance}}.{{user_id}}.demo.echo"

sub:
  allow:
    # Private inbox, under the HASH of the user id (not the raw user id). The client MUST set
    # this prefix when connecting (nats.CustomInboxPrefix in Go, inboxPrefix in nats.js,
    # --inbox-prefix in the CLI): by default the library generates an _INBOX.<random> that no
    # scoped permission authorizes, and the reply never arrives.
    #
    # To find out which hash belongs to a user: `go run ./cmd/session <sub>`.
    - "_INBOX.{{user_id_hash}}.>"

kv:
  # Writes and reads ONLY under their own user id. The scoping goes into the key's subject,
  # so the NATS server enforces it, not the application.
  - bucket: poc-kv
    access: read-write
    keys: "{{user_id}}.>"

response:
  # allow_responses: lets the service answer the caller's inbox without needing an explicit
  # pub permission toward that inbox.
  max: 1
  ttl: 45s

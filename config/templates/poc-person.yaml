# PoC — PERSONA con rol `poc-user` (permisos acotados)
#
# GRAMÁTICA
#   <instancia>.<user-id>.<svc>.<method>
#     instancia  despliegue (dev/stage/prod)
#     user-id    QUIÉN llama: el `sub` de Zitadel, crudo. Igual para personas y servicios.
#     svc        A QUIÉN le habla (en la PoC solo `demo`)
#     method     QUÉ le pide
#
# PLACEHOLDERS
#   {{instance}}      la instancia de deploy
#   {{user_id}}       el `sub` del token, crudo (ojo: guion BAJO, no `{{user-id}}`)
#   {{user_id_hash}}  hash estable del user id — solo para el prefijo de inbox
#   {{service}}       el nombre del endpoint; solo en plantillas de servicio
#
# QUÉ DEMUESTRA ESTA PLANTILLA
#   Frente a poc-person-admin.yaml, el MISMO servicio y los MISMOS buckets, con permisos
#   distintos según el rol:
#     - mensajes: solo dos métodos (no `admin_reset`)
#     - KV:       solo su propia clave (no las de otros)
#   Y frente a las dos, poc-service.yaml muestra el otro tipo de identidad.

pub:
  allow:
    # Allow-list explícita: `admin_reset` NO está, así que no lo alcanza. Con una
    # deny-list, un método nuevo quedaría accesible hasta que alguien lo restrinja; así,
    # no lo alcanza nadie hasta habilitarlo.
    - "{{instance}}.{{user_id}}.demo.ping"
    - "{{instance}}.{{user_id}}.demo.echo"

sub:
  allow:
    # Inbox privado, bajo el HASH del user id (no el user id crudo). El cliente DEBE fijar
    # este prefijo al conectar (nats.CustomInboxPrefix en Go, inboxPrefix en nats.js,
    # --inbox-prefix en el CLI): por defecto la librería genera un _INBOX.<aleatorio> que
    # ningún permiso acotado autoriza, y la respuesta nunca llega.
    #
    # Para saber qué hash le toca a un usuario: `go run ./cmd/session <sub>`.
    - "_INBOX.{{user_id_hash}}.>"

kv:
  # Escribe y lee SOLO bajo su propio user id. El scoping entra en el subject de la clave,
  # así que lo aplica el servidor NATS, no la aplicación.
  - bucket: poc-kv
    access: read-write
    keys: "{{user_id}}.>"

response:
  # allow_responses: deja que el servicio conteste al inbox del caller sin necesitar un
  # permiso de pub explícito hacia ese inbox.
  max: 1
  ttl: 45s

# rules.yaml — PROOF OF CONCEPT: Zitadel role -> (identity type, template)
#
# Deliberate scope: EXAMPLE subjects, not a real domain mapping. What is validated here is
# the mechanism — that the role and the user type change the permissions, both for messages
# and for KV — not the domain. The final subjects get defined once the BFF's contract over
# the bus exists.
#
# There is ONE example service (`demo`) with three methods: ping, echo and admin_reset.
#
# HOW IT IS EVALUATED
#   Rules are walked IN ORDER and the FIRST whose `match` coincides with one of the token's
#   roles wins. With no coincidence, the connection is REJECTED: there are no default
#   permissions, and the PoC proves it (a token with no known role does not connect).
#
# THE ROLE IS THE ONLY THING THAT DECIDES
#   There is no heuristic guessing whether a token belongs to a person or to a service:
#   `type` declares it, and whoever administers Zitadel assigns the role.
#
#   The practical consequence for testing: it makes no difference whether the token comes
#   from a human user or from a machine user. A machine user with the `poc-user` role enters
#   through the person path and receives a person identity. That is what makes it possible to
#   validate all three paths without going through a browser login.

version: 1

rules:
  # Person with broad permissions: every method of `demo`, and read access to all of the KV.
  - match: poc-admin
    type: person
    template: templates/poc-person-admin.yaml

  # Person with scoped permissions: only two methods, and in KV only their own key.
  - match: poc-user
    type: person
    template: templates/poc-person.yaml

  # Service user: serves the `demo` endpoint and owns the test bucket.
  - match: poc-service
    type: service
    service: demo
    template: templates/poc-service.yaml

  # NO catch-all: a valid Zitadel token carrying a role that is not listed here does NOT
  # connect. That is part of what the test verifies.

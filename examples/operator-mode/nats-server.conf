# nats-server.conf — local NATS, operator mode + JetStream.
#
# Operator mode is a requirement of auth callout: authorization is decided with
# account-signed JWTs, and that is what lets the callout issue a different User JWT per
# connection. A server in classic "authorization {}" mode cannot do it.
#
# The auth callout configuration is NOT here: it lives in the AUTH account's JWT, set by
# `nsc edit authcallout` (see bootstrap.sh) and preloaded into nats-resolver.conf.

# Deliberately NON-standard ports (4222/8222), so this NATS can run alongside another one
# already listening on the usual ports.
port: 4322
http: 8322

server_name: auth-callout-nats

# The operator, the system account and every account JWT, preloaded by the bootstrap.
include ./out/nats-resolver.conf

# JetStream: KV buckets are streams. Without this, the KV permissions the callout mints would
# point at subjects nobody serves.
jetstream {
  store_dir: "./data/jetstream"
}

# Auth callout adds a round-trip (validating the token against Zitadel) to every connection's
# handshake, so the authentication timeout has to tolerate it. The 2s default is enough for a
# cached JWKS, but not for the first fetch or for a slow userinfo.
authorization {
  timeout: 5
}

# Logging. debug/trace stay off: trace would log the CONNECTs, which carry the client's access
# token.
debug: false
trace: false
logtime: true
